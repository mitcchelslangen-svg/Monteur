<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV-Storingsmonteur Assistent</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .chat-card { width: 100%; max-width: 500px; background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 85vh; }
        h3 { margin-top: 0; text-align: center; color: #333; }
        #chat-messages { flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 10px; margin-bottom: 10px; background: #fafafa; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 8px; font-size: 14px; max-width: 80%; line-height: 1.4; }
        .bot { background: #e3f2fd; color: #0d47a1; align-self: flex-start; }
        .user { background: #007bff; color: white; align-self: flex-end; }
        .input-box { display: flex; gap: 8px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-card">
    <h3>🔧 CV-Storingsmonteur</h3>
    <div id="chat-messages">
        <div class="msg bot">Hallo! Ik ben je digitale CV-monteur. Welk merk cv-ketel heb je en wat is de storing of foutcode?</div>
    </div>
    <div class="input-box">
        <input type="text" id="userInput" placeholder="Typ je bericht..." onkeydown="if(event.key === 'Enter') verstuur()">
        <button onclick="verstuur()">Stuur</button>
    </div>
</div>

<script>
    function verstuur() {
        const input = document.getElementById('userInput');
        const box = document.getElementById('chat-messages');
        const tekst = input.value.trim();
        if(!tekst) return;

        const userDiv = document.createElement('div');
        userDiv.className = 'msg user';
        userDiv.innerText = tekst;
        box.appendChild(userDiv);
        input.value = '';
        box.scrollTop = box.scrollHeight;

        setTimeout(() => {
            const botDiv = document.createElement('div');
            botDiv.className = 'msg bot';
            
            const txt = tekst.toLowerCase();
            if(txt.includes('f28') || txt.includes('f.28')) {
                botDiv.innerText = "Foutcode F28 (Vaillant) betekent een mislukte ontsteking. Controleer of de gaskraan open staat en of er gas is.";
            } else if(txt.includes('e4') || txt.includes('e04')) {
                botDiv.innerText = "Foutcode E4 (Remeha) geeft vaak een lage waterdruk aan. Controleer of de druk tussen 1,5 en 2,0 bar staat.";
            } else if(txt.includes('druk') || txt.includes('bar')) {
                botDiv.innerText = "De waterdruk hoort tussen 1,5 en 2,0 bar te zijn. Is hij lager? Vul de ketel dan bij via de vulkraan.";
            } else if(txt.includes('gas') || txt.includes('geur') || txt.includes('lek')) {
                botDiv.innerText = "⚠️ LET OP: Ruik je gas of vermoed je een lek? Sluit direct de hoofdgaskraan, ventileer en bel een gecertificeerde monteur!";
            } else {
                botDiv.innerText = "Bedankt voor je bericht. Zorg ervoor dat je de waterdruk controleert (1.5-2.0 bar) en vermeld het merk en het type storingscode voor een specifiek advies.";
            }

            box.appendChild(botDiv);
            box.scrollTop = box.scrollHeight;
        }, 600);
    }
</script>

</body>
</html>
